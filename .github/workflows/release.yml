name: release

# 打 tag(v*)时三端打包,产物上传到 Release。
# 手动触发也支持(workflow_dispatch)。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri -> target

      # Linux 系统依赖(Tauri WebView 需要)
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend deps
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build & bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: "YT_Music ${{ github.ref_name }}"
          releaseBody: "见 Release Notes。首次使用请阅读应用内「帮助中心」。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 上传产物(除创建 Release 外,也作为 artifact 方便下载)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yt-music-${{ matrix.platform }}-${{ matrix.rust_target || 'native' }}
          path: |
            ui/src-tauri/target/release/bundle/**/*
            ui/src-tauri/target/*/release/bundle/**/*
          if-no-files-found: ignore
